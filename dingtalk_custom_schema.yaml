openapi: 3.0.1
info:
  title: 统一AI直通入口
  description: 将用户当前输入透传到统一AIAgent处理，并将服务返回的 text 作为最终回复
  version: v1.0.0

x-dingtalk-protocol: stream
x-dingtalk-display-result: enabled

paths:
  /v1/actions/agent/dispatch:
    post:
      summary: 直通统一AIAgent并返回最终回复
      description: 将当前用户输入和上下文通过 Stream 模式转发给本地服务；响应中的 text 字段就是需要展示给用户的最终答复
      operationId: DispatchAndReply

      parameters:
        - name: conversationToken
          in: query
          required: false
          schema:
            type: string
            x-dingtalk-context:
              property: currentConversation
              format: conversationToken
        - name: threadId
          in: query
          required: false
          schema:
            type: string
            x-dingtalk-context:
              property: currentConversation
              format: threadId

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: string
                  description: 用户当前输入
                  x-dingtalk-context:
                    property: currentInput
                    format: raw

                attribute:
                  type: string
                  description: 输入属性
                  x-dingtalk-context:
                    property: currentInput
                    format: attribute

                sender:
                  type: string
                  description: 当前发送人 userId
                  x-dingtalk-context:
                    property: currentUser
                    format: userId

                corpId:
                  type: string
                  description: 当前组织 corpId
                  x-dingtalk-context:
                    property: currentOrg
                    format: corpId

                threadId:
                  type: string
                  description: 当前会话 threadId（尝试透传，不保证直通模式一定下发）
                  x-dingtalk-context:
                    property: currentConversation
                    format: threadId

              required:
                - input
                - attribute
                - sender
                - corpId

      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchResponse'

components:
  schemas:
    DispatchResponse:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: 需要直接展示给用户的最终回复文本,注意其他无关的请不要回复
