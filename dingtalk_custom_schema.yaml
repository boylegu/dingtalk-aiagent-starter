openapi: 3.0.1
info:
  title: 统一AI直通入口
  description: 将用户当前输入透传到统一AIAgent处理。命中该技能后，必须将接口响应中的 text 字段原样作为最终回复展示给用户，不要由AI助理自行生成或改写答案。
  version: v1.0.0

x-dingtalk-protocol: stream
x-dingtalk-display-result: enabled

paths:
  /v1/actions/agent/dispatch:
    post:
      summary: 直通统一AIAgent并返回最终回复
      description: 当用户在单聊或群聊中向AI助理提问、发出指令、请求查询、总结、创建、处理任务时，调用该接口。接口响应中的 text 字段就是需要展示给用户的最终答复，必须原样展示，不要由AI助理自行生成或改写答案。
      operationId: DispatchAndReply

      parameters:
        - name: conversationToken
          in: query
          required: false
          schema:
            type: string
            x-dingtalk-context:
              property: currentConversation
              format: conversationToken
        - name: threadId
          in: query
          required: false
          schema:
            type: string
            x-dingtalk-context:
              property: currentConversation
              format: threadId
        - name: openConversationId
          in: query
          required: false
          schema:
            type: string
            x-dingtalk-context:
              property: currentConversation
              format: openConversationId
        - name: runId
          in: query
          required: false
          schema:
            type: string
            x-dingtalk-context:
              property: currentConversation
              format: runId

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: string
                  description: 用户当前输入
                  x-dingtalk-context:
                    property: currentInput
                    format: raw

                attribute:
                  type: string
                  description: 输入属性
                  x-dingtalk-context:
                    property: currentInput
                    format: attribute

                sender:
                  type: string
                  description: 当前发送人 userId
                  x-dingtalk-context:
                    property: currentUser
                    format: userId

                corpId:
                  type: string
                  description: 当前组织 corpId
                  x-dingtalk-context:
                    property: currentOrg
                    format: corpId

                threadId:
                  type: string
                  description: 当前会话 threadId（尝试透传，不保证直通模式一定下发）
                  x-dingtalk-context:
                    property: currentConversation
                    format: threadId

                openConversationId:
                  type: string
                  description: 当前会话 openConversationId（群聊消息发送等场景需要）
                  x-dingtalk-context:
                    property: currentConversation
                    format: openConversationId

                runId:
                  type: string
                  description: 当前 AI 助理运行 runId
                  x-dingtalk-context:
                    property: currentConversation
                    format: runId

              required:
                - input
                - attribute
                - sender
                - corpId

      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchResponse'

components:
  schemas:
    DispatchResponse:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: 需要直接展示给用户的最终回复文本。钉钉AI助理必须原样展示该字段内容，不要自行生成、补充或改写。